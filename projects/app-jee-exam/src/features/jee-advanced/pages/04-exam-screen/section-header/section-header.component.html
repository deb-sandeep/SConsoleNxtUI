<div id="section-header-timer-row">
  <span id="section-header-label">Sections</span>
  <span id="exam-timer-display">Time Left :
    <span id="exam-timer-value">{{getRemainingTime()}}</span>
  </span>
</div>

<div id="section-tabs-bar">
  <button type="button" class="nav-arrow-btn" id="section-tabs-prev-btn"
          [disabled]="!canScrollLeft"
          (click)="scrollTabs( -1 )">
    <span class="bi-caret-left-fill"></span>
  </button>
  <div id="section-tabs-list" #tabsList (scroll)="onTabsScroll()">
    @for( section of examSvc.sections; track section.sectionName ) {
      <button type="button" class="section-tab" #tabBtn
              [class.section-tab-active]="section === examSvc.activeSection"
              (click)="selectSection( section )">
        {{section.sectionName}}
        <span class="info-icon bi-info"
              (mouseenter)="snapshotPopup.show( $event, section )"
              (mouseleave)="snapshotPopup.hide()"></span>
      </button>
    }
  </div>
  <button type="button" class="nav-arrow-btn" id="section-tabs-next-btn"
          [disabled]="!canScrollRight"
          (click)="scrollTabs( 1 )">
    <span class="bi-caret-right-fill"></span>
  </button>
</div>
<section-snapshot-info #snapshotPopup></section-snapshot-info>
